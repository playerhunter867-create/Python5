name: Unpack and Build PyFlow

on:
  workflow_dispatch:
  push:
    paths:
      - "PyFlow_GitHub.zip"
      - ".github/workflows/unpack-and-build.yml"
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  unpack-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_PATH="PyFlow_GitHub.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::PyFlow_GitHub.zip was not found in the repository root."
            echo "Upload PyFlow_GitHub.zip to the root of your GitHub repository, then run this workflow again."
            exit 1
          fi

          mkdir -p _pyflow_extract
          unzip -q "$ZIP_PATH" -d _pyflow_extract

          # The archive may contain a top-level PyFlow/ directory.
          if [ -d "_pyflow_extract/PyFlow" ]; then
            SOURCE="_pyflow_extract/PyFlow"
          else
            SOURCE="_pyflow_extract"
          fi

          # Copy all project files, including hidden .github files, into the repository root.
          cp -a "$SOURCE"/. .

          if [ ! -f "settings.gradle.kts" ] || [ ! -f "app/build.gradle.kts" ]; then
            echo "::error::The ZIP did not contain the expected Android Gradle project."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "Project extracted successfully."
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            ! -path "./_pyflow_extract/*" | sort | head -200

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build PyFlow APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
