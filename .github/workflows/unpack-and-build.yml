name: Unpack and Build PyFlow

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'PyFlow.zip'
      - 'PyFlow_GitHub.zip'
      - '.github/workflows/unpack-and-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          for candidate in PyFlow.zip PyFlow_GitHub.zip; do
            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi
          done
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Could not find PyFlow.zip or PyFlow_GitHub.zip in repository root."
            ls -la
            exit 1
          fi
          echo "Using archive: $ZIP_FILE"
          mkdir -p _pyflow_extract
          unzip -q "$ZIP_FILE" -d _pyflow_extract
          SOURCE="_pyflow_extract"
          if [ -d "_pyflow_extract/PyFlow" ]; then SOURCE="_pyflow_extract/PyFlow"; fi
          if [ -d "_pyflow_extract/PyFlow_GitHub" ]; then SOURCE="_pyflow_extract/PyFlow_GitHub"; fi
          if [ ! -f "$SOURCE/settings.gradle.kts" ] || [ ! -f "$SOURCE/app/build.gradle.kts" ]; then
            echo "::error::ZIP does not contain expected Android project files."
            find _pyflow_extract -maxdepth 4 -type f | sort | head -200
            exit 1
          fi
          cp -a "$SOURCE"/. .
          rm -rf _pyflow_extract

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build PyFlow APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
